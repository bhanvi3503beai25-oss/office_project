<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: white;
            min-height: 100vh;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* LEFT PANE */
        .task-section {
            width: 40%;
            background: #f4f4f4;
            padding: 40px;
            border-right: 1px solid #ddd;
        }

        .task-section h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }

        .description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 15px;
            margin-bottom: 8px;
            border-bottom: 1px solid #ddd;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-left input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-text {
            font-size: 16px;
            color: #333;
        }

        .completed {
            text-decoration: line-through;
            color: #999;
        }

        .delete-btn {
            border: none;
            background: transparent;
            color: #555;
            font-size: 22px;
            cursor: pointer;
        }

        .delete-btn:hover {
            color: red;
        }

        /* RIGHT PANE */
        .form-section {
            width: 60%;
            padding: 100px 70px;
        }

        .form-section h2 {
            font-size: 55px;
            color: #777;
            font-weight: bold;
            margin-bottom: 40px;
        }

        #taskForm {
            display: flex;
            flex-direction: column;
            width: 80%;
        }

        #taskInput {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-bottom: 2px solid #ccc;
            outline: none;
            margin-bottom: 25px;
        }

        #taskInput:focus {
            border-bottom-color: #e65c25;
        }

        #taskForm button {
            width: 140px;
            padding: 13px;
            background: #e65c25;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #taskForm button:hover {
            background: #d94f1b;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            .container {
                flex-direction: column;
            }

            .task-section,
            .form-section {
                width: 100%;
            }

            .form-section {
                padding: 50px 30px;
            }

            .form-section h2 {
                font-size: 40px;
            }

            #taskForm {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT PANE -->
        <div class="task-section">

            <h1>TASK LIST</h1>

            <p class="description">
                Add tasks to your list by typing to the right and pressing enter.
                You may then view pending tasks below.
            </p>

            <div id="taskList"></div>

        </div>


        <!-- RIGHT PANE -->
        <div class="form-section">

            <h2>I need to...</h2>

            <form id="taskForm">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task"
                    autocomplete="off"
                    required
                >

                <button type="submit">Add Task</button>

            </form>

        </div>

    </div>


    <script>

        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");


        /* ADD TASK */

        taskForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const taskText = taskInput.value.trim();

            if (taskText === "") {
                return;
            }

            addTask(taskText);

            taskInput.value = "";

            taskInput.focus();
        });


        /* CREATE TASK */

        function addTask(taskText) {

            const task = document.createElement("div");

            task.className = "task";


            /* LEFT PART */

            const taskLeft = document.createElement("div");

            taskLeft.className = "task-left";


            /* CHECKBOX */

            const checkbox = document.createElement("input");

            checkbox.type = "checkbox";


            /* TASK TEXT */

            const text = document.createElement("span");

            text.className = "task-text";

            text.textContent = taskText;


            /* DELETE BUTTON */

            const deleteButton = document.createElement("button");

            deleteButton.className = "delete-btn";

            deleteButton.textContent = "×";


            /* COMPLETE TASK */

            checkbox.addEventListener("change", function() {

                if (checkbox.checked) {

                    text.classList.add("completed");

                } else {

                    text.classList.remove("completed");

                }

            });


            /* DELETE TASK */

            deleteButton.addEventListener("click", function() {

                task.remove();

            });


            /* ADD ELEMENTS */

            taskLeft.appendChild(checkbox);

            taskLeft.appendChild(text);

            task.appendChild(taskLeft);

            task.appendChild(deleteButton);

            taskList.appendChild(task);
        }

    </script>

</body>
</html>
