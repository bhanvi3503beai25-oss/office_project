<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FedEx Admin | Forgot Password</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071a36,#173d70);font-family:Arial,sans-serif;padding:24px}.card{background:#fff;width:min(100%,420px);padding:34px;border-radius:18px}.brand{font-size:22px;font-weight:bold;color:#173d70}p{color:#68758a;line-height:1.5}label{display:block;margin:20px 0 7px;font-weight:600}input{width:100%;padding:13px;border:1px solid #d6dce5;border-radius:9px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#173d70;color:#fff;font-weight:bold;cursor:pointer}.msg{margin-top:14px;font-size:14px}a{display:inline-block;margin-top:18px;color:#174d8e;text-decoration:none}</style></head>
<body><main class="card"><div class="brand">📦 FedEx Admin</div><h1>Forgot password?</h1><p>Enter the registered admin email address. If it matches the account, we’ll send a reset link.</p>
<form id="forgotForm"><label for="email">Registered email</label><input id="email" type="email" required autocomplete="email"><button>Send reset link</button></form><div class="msg" id="msg" role="status"></div><a href="/login.html">← Back to sign in</a></main>
<script>document.getElementById("forgotForm").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("msg");msg.textContent="Sending…";try{const r=await fetch("/api/auth/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not send reset email.");msg.textContent=d.message||"If that email is registered, a reset link will be sent.";}catch(err){msg.textContent=err.message;}});</script></body></html>
