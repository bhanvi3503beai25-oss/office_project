<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To Do App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* LEFT PANE */

        .left {
            width: 40%;
            background: #f5f5f5;
            padding: 35px;
            border-right: 1px solid #ddd;
        }

        .left h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 12px;
        }

        .info {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        #taskList {
            width: 100%;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #fff;
            border-bottom: 1px solid #ddd;

            padding: 12px 10px;
            min-height: 45px;
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 10px;

            flex: 1;
        }

        .task-content input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .task-name {
            font-size: 15px;
            color: #333;
            word-break: break-word;
        }

        .completed {
            text-decoration: line-through;
            color: #888;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 10px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 17px;
            padding: 2px;
        }

        .edit-btn {
            color: #555;
        }

        .delete-btn {
            color: #555;
        }

        .edit-btn:hover {
            color: #1976d2;
        }

        .delete-btn:hover {
            color: red;
        }


        /* RIGHT PANE */

        .right {
            width: 60%;
            padding: 90px 70px;
        }

        .right h2 {
            font-size: 52px;
            color: #777;
            margin-bottom: 35px;
        }

        #taskInput {
            width: 80%;
            min-height: 55px;

            border: none;
            border-bottom: 2px solid #ccc;

            outline: none;

            resize: none;

            font-size: 20px;
            padding: 10px 5px;

            color: #444;
        }

        #taskInput:focus {
            border-bottom-color: #777;
        }

        .hint {
            color: #999;
            font-size: 13px;
            margin-top: 10px;
        }


        /* EMPTY MESSAGE */

        .empty {
            color: #999;
            font-size: 14px;
            padding: 15px 5px;
        }


        /* EDIT INPUT */

        .edit-input {
            border: none;
            border-bottom: 1px solid #777;
            outline: none;
            font-size: 15px;
            padding: 3px;
            width: 100%;
        }


        /* MOBILE */

        @media (max-width: 768px) {

            .container {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .right {
                padding: 50px 30px;
            }

            .right h2 {
                font-size: 40px;
            }

            #taskInput {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT PANE -->

        <div class="left">

            <h1>TASK LIST</h1>

            <p class="info">
                Add tasks to your list by typing to the right and
                pressing enter. You may then view pending tasks below.
            </p>

            <div id="taskList"></div>

        </div>


        <!-- RIGHT PANE -->

        <div class="right">

            <h2>I need to...</h2>

            <textarea
                id="taskInput"
                placeholder=""
                rows="1"
            ></textarea>

            <p class="hint">
                Press ENTER to add a task
            </p>

        </div>

    </div>


    <script>

        /* --------------------------------
           GET ELEMENTS
        -------------------------------- */

        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");


        /* --------------------------------
           GET TASKS FROM LOCAL STORAGE
        -------------------------------- */

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];


        /* --------------------------------
           SAVE TASKS TO LOCAL STORAGE
        -------------------------------- */

        function saveTasks() {

            localStorage.setItem("tasks", JSON.stringify(tasks));

        }


        /* --------------------------------
           DISPLAY TASKS
        -------------------------------- */

        function displayTasks() {

            taskList.innerHTML = "";

            if (tasks.length === 0) {

                taskList.innerHTML =
                    '<div class="empty">No tasks added yet.</div>';

                return;
            }


            tasks.forEach(function(task) {

                const taskDiv = document.createElement("div");

                taskDiv.className = "task";


                /* TASK CONTENT */

                const taskContent = document.createElement("div");

                taskContent.className = "task-content";


                /* CHECKBOX */

                const checkbox = document.createElement("input");

                checkbox.type = "checkbox";

                checkbox.checked = task.completed;


                /* TASK NAME */

                const taskName = document.createElement("span");

                taskName.className = "task-name";

                taskName.textContent = task.name;


                if (task.completed) {

                    taskName.classList.add("completed");

                }


                /* CHECKBOX EVENT */

                checkbox.addEventListener("change", function() {

                    task.completed = checkbox.checked;

                    saveTasks();

                    displayTasks();

                });


                taskContent.appendChild(checkbox);

                taskContent.appendChild(taskName);


                /* ACTION BUTTONS */

                const actions = document.createElement("div");

                actions.className = "actions";


                /* EDIT BUTTON */

                const editButton = document.createElement("button");

                editButton.className = "edit-btn";

                editButton.innerHTML = "✎";

                editButton.title = "Edit task";


                editButton.addEventListener("click", function() {

                    editTask(task);

                });


                /* DELETE BUTTON */

                const deleteButton = document.createElement("button");

                deleteButton.className = "delete-btn";

                deleteButton.innerHTML = "×";

                deleteButton.title = "Delete task";


                deleteButton.addEventListener("click", function() {

                    deleteTask(task);

                });


                actions.appendChild(editButton);

                actions.appendChild(deleteButton);


                taskDiv.appendChild(taskContent);

                taskDiv.appendChild(actions);


                taskList.appendChild(taskDiv);

            });

        }


        /* --------------------------------
           ADD TASK ON ENTER
        -------------------------------- */

        taskInput.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                const taskName = taskInput.value.trim();


                if (taskName === "") {

                    return;

                }


                const newTask = {

                    id: Date.now(),

                    name: taskName,

                    completed: false

                };


                tasks.push(newTask);


                saveTasks();

                displayTasks();


                taskInput.value = "";

            }

        });


        /* --------------------------------
           DELETE TASK
        -------------------------------- */

        function deleteTask(task) {

            tasks = tasks.filter(function(item) {

                return item.id !== task.id;

            });


            saveTasks();

            displayTasks();

        }


        /* --------------------------------
           EDIT TASK
        -------------------------------- */

        function editTask(task) {

            const newName = prompt(
                "Enter updated task name:",
                task.name
            );


            if (newName === null) {

                return;

            }


            const updatedName = newName.trim();


            if (updatedName === "") {

                return;

            }


            task.name = updatedName;


            saveTasks();

            displayTasks();

        }


        /* --------------------------------
           INITIAL LOAD
        -------------------------------- */

        displayTasks();

    </script>

</body>
</html>
