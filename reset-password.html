<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FedEx Admin | Reset Password</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071a36,#173d70);font-family:Arial,sans-serif;padding:24px}.card{background:#fff;width:min(100%,420px);padding:34px;border-radius:18px}.brand{font-size:22px;font-weight:bold;color:#173d70}p{color:#68758a;line-height:1.5}label{display:block;margin:20px 0 7px;font-weight:600}input{width:100%;padding:13px;border:1px solid #d6dce5;border-radius:9px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#173d70;color:#fff;font-weight:bold;cursor:pointer}.msg{margin-top:14px;font-size:14px}a{display:inline-block;margin-top:18px;color:#174d8e;text-decoration:none}</style></head>
<body><main class="card"><div class="brand">📦 FedEx Admin</div><h1>Set a new password</h1><p>Use at least 12 characters. This reset link expires after 15 minutes.</p>
<form id="resetForm"><label for="password">New password</label><input id="password" type="password" minlength="12" required autocomplete="new-password"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="12" required autocomplete="new-password"><button>Update password</button></form><div class="msg" id="msg" role="status"></div><a href="/login.html">Back to sign in</a></main>
<script>document.getElementById("resetForm").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("msg"),password=document.getElementById("password").value;if(password!==document.getElementById("confirm").value){msg.textContent="Passwords do not match.";return;}msg.textContent="Updating password…";try{const r=await fetch("/api/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:new URLSearchParams(location.search).get("token"),password})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not reset password.");msg.textContent=d.message;document.getElementById("resetForm").hidden=true;}catch(err){msg.textContent=err.message;}});</script></body></html>
