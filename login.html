<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FedEx Admin | Sign In</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071a36,#173d70);font-family:Arial,sans-serif;color:#182338;padding:24px}
    .card{background:#fff;width:min(100%,420px);border-radius:18px;padding:36px;box-shadow:0 24px 70px #0004}
    .brand{font-size:23px;font-weight:700;color:#173d70;margin-bottom:8px}.muted{color:#68758a;font-size:14px;line-height:1.5}
    label{display:block;font-size:14px;font-weight:600;margin:20px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d6dce5;border-radius:9px;font-size:15px}
    .password{display:flex;gap:8px}.password input{flex:1;min-width:0}.small{border:1px solid #d6dce5;border-radius:9px;background:#f5f7fa;padding:0 12px;cursor:pointer}
    button.primary{margin-top:22px;width:100%;border:0;border-radius:9px;padding:14px;background:#173d70;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
    a{color:#174d8e;text-decoration:none;font-size:14px}.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.message{margin-top:15px;font-size:14px;color:#b42318}.message.ok{color:#167447}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">📦 FedEx Admin</div>
    <h1>Welcome back</h1><p class="muted">Sign in to access the Employee Management Dashboard.</p>
    <form id="loginForm">
      <label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="small" type="button" id="togglePassword">Show</button></div>
      <button class="primary" type="submit" id="submitBtn">Sign In</button><div class="message" id="message" role="status"></div>
    </form>
    <div class="links"><a href="/forgot-password.html">Forgot password?</a><span class="muted">Secure admin access</span></div>
  </main>
  <script>
    const form=document.getElementById("loginForm"), message=document.getElementById("message"), btn=document.getElementById("submitBtn");
    document.getElementById("togglePassword").addEventListener("click",()=>{const p=document.getElementById("password");p.type=p.type==="password"?"text":"password";document.getElementById("togglePassword").textContent=p.type==="password"?"Show":"Hide";});
    form.addEventListener("submit",async e=>{e.preventDefault();message.className="message";message.textContent="Signing in…";btn.disabled=true;
      try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({username:form.username.value,password:form.password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Sign-in failed.");location.href=d.redirect||"/INDEX.HTML";}
      catch(err){message.textContent=err.message;}finally{btn.disabled=false;}
    });
  </script>
</body></html>
